name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv venv --allow-existing && uv pip install -e ".[dev,bedrock]"
      - name: Lint
        run: |
          .venv/bin/ruff check email_assistant evals tests dashboard
          .venv/bin/ruff format --check email_assistant evals tests dashboard
      - name: Tests (offline, no API key)
        run: .venv/bin/python -m pytest -q
      - name: Golden eval - rule-based baseline
        run: .venv/bin/python -m evals.run --mode offline --check
      - name: Golden eval - recorded Gemini responses + recorded faithfulness judge (replay)
        run: .venv/bin/python -m evals.run --mode replay --judge local --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports
          path: evals/reports/

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Kubernetes manifests
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary deploy/k8s/
      - name: Build container
        run: docker build -t email-assistant:ci .
