name: live-eval
# Manual only: calls the real Gemini API (costs quota) and refreshes the replay
# cache artifact. Never runs on forks or PRs, so the secret is not exposed.
on:
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv venv --allow-existing && uv pip install -e ".[dev]"
      - name: Live golden eval (throttled)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_REQUESTS_PER_MINUTE: "30"
        run: .venv/bin/python -m evals.run --mode live --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-eval
          path: |
            evals/reports/
            evals/llm_cache/
            evals/embed_cache/
