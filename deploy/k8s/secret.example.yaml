# Example only - never commit real values. In AWS use External Secrets Operator
# syncing from Secrets Manager (or IRSA for Bedrock, which needs no key at all).
apiVersion: v1
kind: Secret
metadata:
  name: email-assistant-secrets
  labels: {app: email-assistant}
type: Opaque
stringData:
  GEMINI_API_KEY: "<set-via-external-secrets>"
